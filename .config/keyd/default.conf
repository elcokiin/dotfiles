# keyd: system-wide input remapping.
#
# Makes AltGr + HJKL emit arrow keys in every application, terminal and TTY.
# `rightalt` already maps to the built-in altgr layer by default; we only add
# bindings for it.
#
# Apply with: sudo .config/keyd/install.sh

[ids]
*

[altgr:G]
h = left
j = down
k = up
l = right