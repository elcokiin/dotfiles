# keyd: system-wide input remapping.
#
# Top-row digit keys emit their shifted symbols (! @ # $ ...) by default, so
# no Shift is needed for symbols. The digits themselves come from
# AltGr + QWERTYUIOP, and AltGr + HJKL are the arrow keys. `rightalt` already
# maps to the built-in altgr layer by default; we only add bindings for it.
#
# Apply with: sudo .config/keyd/install.sh

[ids]
*

[main]
1 = !
2 = @
3 = #
4 = $
5 = %
6 = ^
7 = &
8 = *
9 = (
0 = )

[altgr:G]
h = left
j = down
k = up
l = right

q = 1
w = 2
e = 3
r = 4
t = 5
y = 6
u = 7
i = 8
o = 9
p = 0
