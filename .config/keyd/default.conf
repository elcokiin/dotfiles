# keyd: system-wide input remapping.
# Apply with: sudo .config/keyd/install.sh
#
# keyd runs at the kernel/evdev level, below Wayland, Hyprland and Omarchy.
# Right Alt (AltGr) is claimed here as a private keyd layer, so the compositor
# never sees Alt_R and no Omarchy update can take AltGr back.

[ids]
*

[main]
capslock = layer(control)

# AltGr is a keyd-only layer key. This binding is the default one, written out
# on purpose: `special` is our own layer, not the built-in `altgr` modifier
# layer (which always carries :G). Because of that, holding AltGr emits nothing
# to Hyprland until a key inside the layer is pressed.
rightalt = layer(special)

# Left Alt + Caps Lock emits F13, which Hyprland binds to dictation
# push-to-talk. Do not use Right Alt here: Left Alt + AltGr must stay a real
# modifier combo so Alt + AltGr + H/L can still produce Alt + Left/Right
# (herdr tab switching) while AltGr + H/L alone stay plain arrows.
[alt]
capslock = f13

# AltGr layer (no ':G' suffix on purpose). Keys listed here are emitted without
# AltGr; keys not listed fall through to `main` unmodified.
[special]
h = left
j = down
k = up
l = right

g = home
[ = pageup
] = pagedown

; = volumedown
' = volumeup

- = brightnessdown
= = brightnessup

tab = esc

q = 1
w = 2
e = 3
r = 4
t = 5
y = 6
u = 7
i = 8
o = 9
p = 0

[special+shift]
g = end
